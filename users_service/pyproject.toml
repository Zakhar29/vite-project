[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "user-service"
version = "1.0.0"
description = "FastAPI User Service with authentication, followers and friends"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fastapi==0.135.3",
    "uvicorn==0.44.0",
    "SQLAlchemy==2.0.49",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "python-jose==3.5.0",
    "passlib==1.7.4",
    "redis==7.4.0",
    "uuid6==2025.0.1",
    "python-dotenv==1.2.2",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "bcrypt>=4.0.0",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
start = "uvicorn main:app --host 0.0.0.0 --port 8000 --reload"